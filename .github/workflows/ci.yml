name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
          # The zips live in .output, which the artifact action skips as a hidden directory.
          include-hidden-files: true
          if-no-files-found: error
